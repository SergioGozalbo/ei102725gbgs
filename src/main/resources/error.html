<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>SgOVI - Error</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="card" style="max-width: 480px; text-align: center;">
    <div class="header">
        <div class="logo" style="background: #dc2626;">
            <svg width="34" height="34" viewBox="0 0 32 32" fill="none">
                <path d="M16 6L16 18" stroke="white" stroke-width="3" stroke-linecap="round"/>
                <circle cx="16" cy="24" r="2" fill="white"/>
            </svg>
        </div>
        <h1 th:text="${status} ?: '404'">404</h1>
        <p class="subtitle" th:text="${error} ?: 'Página no encontrada'">Página no encontrada</p>
    </div>

    <p style="font-size: 0.9rem; color: #6b7280; margin-bottom: 2rem; line-height: 1.6;">
        La página que buscas no existe o ha ocurrido un error inesperado.
        Vuelve al inicio e inténtalo de nuevo.
    </p>

    <a th:href="@{/}" class="btn btn-primary">Volver al inicio</a>
    <a th:href="@{/login}" class="btn btn-outline">Iniciar sesión</a>
</div>
</body>
</html>
