<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>SgOVI - Añadir Asistente</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="form-page">
<nav>
    <span class="nav-brand">SgOVI</span>
    <div class="nav-right">
        <a th:href="@{/logout}" class="btn-logout">Cerrar sesión</a>
    </div>
</nav>

<main>
    <div class="page-actions">
        <div>
            <h1 class="page-title">Nuevo Asistente Personal</h1>
            <p class="page-subtitle">Rellena los datos para registrar un nuevo asistente.</p>
        </div>
        <a th:href="@{/AssistentPersonal/list}" class="btn-back">Volver a la lista</a>
    </div>

    <div class="form-card">
        <form th:action="@{/AssistentPersonal/add}" th:object="${assistentPersonal}" method="post">
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input id="nombre" type="text" th:field="*{nombre}" placeholder="Nombre"/>
                <div th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="error"></div>
            </div>

            <div class="form-group">
                <label for="apellidos">Apellidos</label>
                <input id="apellidos" type="text" th:field="*{apellidos}" placeholder="Apellidos"/>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" type="email" th:field="*{email}" placeholder="correo@ejemplo.com"/>
                <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error"></div>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input id="password" type="password" th:field="*{password}" placeholder="••••••••"/>
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono</label>
                <input id="telefono" type="text" th:field="*{telefono}" placeholder="6XXXXXXXX"/>
                <div th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}" class="error"></div>
            </div>

            <div class="form-group">
                <label for="formacionAcademica">Formación académica</label>
                <textarea id="formacionAcademica" th:field="*{formacionAcademica}" rows="3"
                          placeholder="Describe la formación académica"></textarea>
                <div th:if="${#fields.hasErrors('formacionAcademica')}" th:errors="*{formacionAcademica}" class="error"></div>
            </div>

            <div class="form-group">
                <label for="experiencia">Experiencia</label>
                <textarea id="experiencia" th:field="*{experiencia}" rows="3"
                          placeholder="Describe la experiencia profesional"></textarea>
            </div>

            <input type="hidden" th:field="*{estadoAceptado}"/>

            <button type="submit" class="btn btn-primary">Guardar</button>
        </form>
    </div>
</main>
</body>
</html>
