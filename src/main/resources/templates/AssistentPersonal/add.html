<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>SgOVI - Nou Assistent Personal</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="form-page">
<nav>
    <span class="nav-brand">SgOVI - Administració</span>
    <div class="nav-right">
        <a th:href="@{/logout}" class="btn-logout">Tancar sessió</a>
    </div>
</nav>
<main>
    <div class="page-actions">
        <div>
            <h1 class="page-title">Nou Assistent Personal</h1>
            <p class="page-subtitle">Omple les dades per registrar un nou assistent.</p>
        </div>
    </div>
    <div class="form-card">
        <form th:action="@{/AssistentPersonal/add}"
              th:object="${assistentPersonal}" method="post">
            <div class="form-group">
                <label for="nombre">Nom</label>
                <input id="nombre" type="text" th:field="*{nombre}"
                       placeholder="Nom"/>
                <span th:if="${#fields.hasErrors('nombre')}"
                      th:errors="*{nombre}" class="error"></span>
            </div>
            <div class="form-group">
                <label for="apellidos">Cognoms</label>
                <input id="apellidos" type="text" th:field="*{apellidos}"
                       placeholder="Cognoms"/>
                <span th:if="${#fields.hasErrors('apellidos')}"
                      th:errors="*{apellidos}" class="error"></span>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" type="email" th:field="*{email}"
                       placeholder="correu@exemple.com"/>
                <span th:if="${#fields.hasErrors('email')}"
                      th:errors="*{email}" class="error"></span>
            </div>
            <div class="form-group">
                <label for="password">Contrasenya</label>
                <input id="password" type="password" th:field="*{password}"
                       placeholder="••••••••"/>
                <span th:if="${#fields.hasErrors('password')}"
                      th:errors="*{password}" class="error"></span>
            </div>
            <div class="form-group">
                <label for="telefono">Telèfon</label>
                <input id="telefono" type="text" th:field="*{telefono}"
                       placeholder="6XXXXXXXX"/>
                <span th:if="${#fields.hasErrors('telefono')}"
                      th:errors="*{telefono}" class="error"></span>
            </div>
            <div class="form-group">
                <label for="formacionAcademica">Formació acadèmica</label>
                <textarea id="formacionAcademica"
                          th:field="*{formacionAcademica}" rows="3"
                          placeholder="Descriu la formació acadèmica"></textarea>
                <span th:if="${#fields.hasErrors('formacionAcademica')}"
                      th:errors="*{formacionAcademica}" class="error"></span>
            </div>
            <div class="form-group">
                <label for="experiencia">Experiència</label>
                <textarea id="experiencia" th:field="*{experiencia}" rows="3"
                          placeholder="Descriu l'experiència professional"></textarea>
            </div>
            <input type="hidden" th:field="*{estadoAceptado}"/>
            <div style="display:flex; gap:1rem; margin-top:1.5rem;">
                <button type="submit" class="btn btn-primary"
                        style="flex:1;">Guardar</button>
                <a th:href="@{/AssistentPersonal/list}" class="btn btn-outline"
                   style="flex:1; text-align:center;">Cancel·lar</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
