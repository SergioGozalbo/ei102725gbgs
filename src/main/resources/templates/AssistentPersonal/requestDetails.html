<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>SgOVI - Detalls de la Sol·licitud</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="form-page">
<nav aria-label="Navegació principal">
    <span class="nav-brand">SgOVI</span>
    <div class="nav-right">
        <a th:href="@{/AssistentPersonal/requests}" class="btn-logout">Tornar</a>
    </div>
</nav>
<main>
    <div class="page-actions">
        <div>
            <h1 class="page-title">Detalls de la Sol·licitud</h1>
            <p class="page-subtitle">Informació de la petició d'assistència.</p>
        </div>
        <a th:href="@{/AssistentPersonal/requests}" class="btn-back">Tornar</a>
    </div>
    <div class="form-card" style="max-width:700px;">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:2rem;">
            <div>
                <h2 class="card-title"
                    style="margin-bottom:1rem; padding-bottom:0.5rem;
                           border-bottom:2px solid #e5e7eb;">
                    Usuari OVI
                </h2>
                <div class="field-group">
                    <span class="field-label">Nom i cognoms</span>
                    <div class="field-readonly"
                         th:text="${usuari.nombre} + ' ' + ${usuari.apellidos}"></div>
                </div>
                <div class="field-group">
                    <span class="field-label">Email</span>
                    <div class="field-readonly" th:text="${usuari.email}"></div>
                </div>
                <div class="field-group">
                    <span class="field-label">Telèfon</span>
                    <div class="field-readonly" th:text="${usuari.telefono}"></div>
                </div>
            </div>
            <div>
                <h2 class="card-title"
                    style="margin-bottom:1rem; padding-bottom:0.5rem;
                           border-bottom:2px solid #e5e7eb;">
                    Servei sol·licitat
                </h2>
                <div class="field-group">
                    <span class="field-label">Tipus d'assistència</span>
                    <div class="field-readonly"
                         th:text="${request.tipoAsistencia}"></div>
                </div>
                <div class="field-group">
                    <span class="field-label">Província</span>
                    <div class="field-readonly"
                         th:text="${request.proximidad}"></div>
                </div>
                <div class="field-group">
                    <span class="field-label">Estat</span>
                    <span class="badge-estat badge-pendent"
                          th:text="${request.estado}"></span>
                </div>
            </div>
        </div>
        <div class="field-group" style="margin-top:1rem;">
            <span class="field-label">Preferències</span>
            <div class="field-readonly"
                 style="white-space:pre-wrap; min-height:60px;">
                <span th:if="${request.preferencias != null
                               and !request.preferencias.isEmpty()}"
                      th:text="${request.preferencias}"></span>
                <span th:unless="${request.preferencias != null
                                   and !request.preferencias.isEmpty()}"
                      class="text-waiting">
                    Sense preferències especificades.
                </span>
            </div>
        </div>
    </div>
</main>
</body>
</html>
