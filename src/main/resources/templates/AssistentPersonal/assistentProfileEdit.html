<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>SgOVI - Editar perfil</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="logo">
      <svg width="32" height="32" fill="none" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4" fill="#ffffff"/>
        <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="#ffffff"
              stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>Editar perfil</h1>
    <p class="subtitle">Modifica les teues dades personals</p>
  </div>

  <form th:action="@{/AssistentPersonal/profileEdit}"
        th:object="${assistentPersonal}" method="post">

    <!-- ID oculto para que el update funcione -->
    <input type="hidden" th:field="*{idAsistente}"/>
    <!-- Estado oculto para no perderlo -->
    <input type="hidden" th:field="*{estadoAceptado}"/>
    <input type="hidden" th:field="*{password}"/>

    <div class="form-group">
      <label for="nombre">Nom</label>
      <input id="nombre" type="text" th:field="*{nombre}"/>
      <div th:if="${#fields.hasErrors('nombre')}"
           th:errors="*{nombre}" class="error"></div>
    </div>

    <div class="form-group">
      <label for="apellidos">Cognoms</label>
      <input id="apellidos" type="text" th:field="*{apellidos}"/>
      <div th:if="${#fields.hasErrors('apellidos')}"
           th:errors="*{apellidos}" class="error"></div>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" th:field="*{email}"/>
      <div th:if="${#fields.hasErrors('email')}"
           th:errors="*{email}" class="error"></div>
    </div>

    <div class="form-group">
      <label for="telefono">Telèfon</label>
      <input id="telefono" type="tel" th:field="*{telefono}"/>
      <div th:if="${#fields.hasErrors('telefono')}"
           th:errors="*{telefono}" class="error"></div>
    </div>

    <div class="form-group">
      <label for="formacionAcademica">Formació acadèmica</label>
      <textarea id="formacionAcademica" rows="3"
                th:field="*{formacionAcademica}"></textarea>
      <div th:if="${#fields.hasErrors('formacionAcademica')}"
           th:errors="*{formacionAcademica}" class="error"></div>
    </div>

    <div class="form-group">
      <label for="experiencia">Experiència professional</label>
      <textarea id="experiencia" rows="3"
                th:field="*{experiencia}"></textarea>
      <div th:if="${#fields.hasErrors('experiencia')}"
           th:errors="*{experiencia}" class="error"></div>
    </div>

    <div class="divider"></div>

    <button type="submit" class="btn btn-primary">Guardar canvis</button>
    <a th:href="@{/AssistentPersonal/profile}" class="btn btn-outline">
      Cancel·lar
    </a>
  </form>
</div>
</body>
</html>
