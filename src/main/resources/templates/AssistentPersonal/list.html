<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>SgOVI - Assistents Personals</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="table-page">
<nav>
    <span class="nav-brand">SgOVI - Administració</span>
    <div class="nav-right">
        <a th:href="@{/logout}" class="btn-logout">Tancar sessió</a>
    </div>
</nav>
<main>
    <div th:if="${errorMsg}" class="alert-error" th:text="${errorMsg}"></div>

    <div class="page-actions">
        <div>
            <h1 class="page-title">Assistents Personals</h1>
            <p class="page-subtitle">Llista de tots els assistents registrats.</p>
        </div>
        <div style="display:flex; gap:0.75rem;">
            <a th:href="@{/AssistentPersonal/add}" class="btn-new">+ Nou assistent</a>
            <a th:href="@{/dashboard/admin}" class="btn-back">Tornar al panell</a>
        </div>
    </div>

    <form method="get" th:action="@{/AssistentPersonal/list}"
          style="margin-bottom:1.5rem; display:flex; gap:0.75rem;
                 align-items:center; flex-wrap:wrap;">
        <label for="busqueda" class="visually-hidden">Cerca per nom o cognoms</label>
        <input type="text" id="busqueda" name="busqueda" th:value="${busqueda}"
               placeholder="Cerca per nom o cognoms..."
               style="max-width:280px;"/>
        <label for="estat" class="visually-hidden">Filtre per estat</label>
        <select id="estat" name="estat" style="max-width:160px;">
            <option value="" th:selected="${estat == ''}">Tots els estats</option>
            <option value="Aceptado" th:selected="${estat == 'Aceptado'}">Acceptat</option>
            <option value="Rechazado" th:selected="${estat == 'Rechazado'}">Rebutjat</option>
            <option value="Pendiente" th:selected="${estat == 'Pendiente'}">Pendent</option>
        </select>
        <button type="submit" class="btn-new">Cercar</button>
        <button type="button" class="btn-back"
                onclick="window.location.href='/AssistentPersonal/list'">Netejar</button>
    </form>

    <p style="font-size:0.85rem; color:#4b5563; margin-bottom:1rem;"
       th:text="'Mostrant ' + ${#lists.size(asistentes)}
                + ' de ' + ${totalRegistres} + ' registres'"></p>

    <div th:if="${#lists.isEmpty(asistentes)}"
         style="text-align:center; padding:2rem; color:#4b5563;">
        No s'han trobat assistents.
    </div>

    <div class="table-container" th:unless="${#lists.isEmpty(asistentes)}">
        <table>
            <caption class="visually-hidden">Llistat d'assistents personals</caption>
            <thead>
            <tr>
                <th scope="col">Nom i cognoms</th>
                <th scope="col">Email</th>
                <th scope="col">Telèfon</th>
                <th scope="col">Estat</th>
                <th scope="col">Accions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="asistente : ${asistentes}">
                <td th:text="${asistente.nombre} + ' ' + ${asistente.apellidos}"></td>
                <td th:text="${asistente.email}"></td>
                <td th:text="${asistente.telefono}"></td>
                <td>
                    <span class="badge-estat"
                          th:classappend="${asistente.estadoAceptado == 'Aceptado'}
                                          ? ' badge-acceptat' :
                                         (${asistente.estadoAceptado == 'Rechazado'}
                                          ? ' badge-rebutjat' : ' badge-pendent')"
                          th:text="${asistente.estadoAceptado}"></span>
                </td>
                <td>
                    <div class="table-actions">
                        <a th:href="@{/AssistentPersonal/update/{id}(id=${asistente.idAsistente})}"
                           class="btn-edit">Editar</a>
                        <a th:href="@{/AssistentPersonal/confirmDelete/{id}(id=${asistente.idAsistente})}"
                           class="btn-delete">Eliminar</a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Paginació -->
    <div th:if="${totalPagines > 1}"
         style="display:flex; gap:0.5rem; align-items:center;
                margin-top:1.5rem; justify-content:center;">
        <a th:if="${paginaActual > 0}"
           th:href="@{/AssistentPersonal/list(busqueda=${busqueda},
                      estat=${estat}, pagina=${paginaActual - 1})}"
           class="btn-back">← Anterior</a>
        <span th:each="i : ${#numbers.sequence(0, totalPagines - 1)}">
            <a th:if="${i != paginaActual}"
               th:href="@{/AssistentPersonal/list(busqueda=${busqueda},
                          estat=${estat}, pagina=${i})}"
               class="btn-back" th:text="${i + 1}"></a>
            <span th:if="${i == paginaActual}"
                  class="btn-new" th:text="${i + 1}"
                  style="cursor:default;"></span>
        </span>
        <a th:if="${paginaActual < totalPagines - 1}"
           th:href="@{/AssistentPersonal/list(busqueda=${busqueda},
                      estat=${estat}, pagina=${paginaActual + 1})}"
           class="btn-back">Següent →</a>
    </div>
</main>
</body>
</html>
