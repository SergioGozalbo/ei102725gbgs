<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>SgOVI - Assistents Personals</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css"/>
</head>
<body class="table-page">
<nav aria-label="Navegació principal">
    <span class="nav-brand">SgOVI - Administració</span>
    <div class="nav-right">
        <a th:href="@{/logout}" class="btn-logout">Tancar sessió</a>
    </div>
</nav>
<main>
    <div th:if="${errorMsg}"
         style="background:#fee2e2; border:1px solid #fca5a5; color:#991b1b;
                border-radius:10px; padding:1rem 1.2rem; margin-bottom:1.5rem;
                display:flex; align-items:center; gap:0.75rem;">
        <span style="font-size:1.3rem;">&#9888;</span>
        <span th:text="${errorMsg}"></span>
    </div>
    <div class="page-actions">
        <div>
            <h1 class="page-title">Assistents Personals</h1>
            <p class="page-subtitle">Llista de tots els assistents registrats.</p>
        </div>
        <div style="display:flex; gap:0.75rem;">
            <a th:href="@{/AssistentPersonal/add}" class="btn-new">+ Nou assistent</a>
            <a th:href="@{/}" class="btn-back">Tornar al menu</a>
        </div>
    </div>
    <div class="table-container">
        <table id="tablaAsistentes" style="width:100%">
            <thead>
            <tr>
                <th>Nom</th>
                <th>Email</th>
                <th>Telefon</th>
                <th>Formacio</th>
                <th>Experiencia</th>
                <th>Estat</th>
                <th>Accions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="asistente : ${asistentes}">
                <td th:text="${asistente.nombre} + ' ' + ${asistente.apellidos}"></td>
                <td th:text="${asistente.email}"></td>
                <td th:text="${asistente.telefono}"></td>
                <td th:text="${asistente.formacionAcademica}"></td>
                <td th:text="${asistente.experiencia}"></td>
                <td>
                    <span th:class="${asistente.estadoAceptado == 'Aceptado'}
                                    ? 'badge-estat badge-acceptat'
                                    : (${asistente.estadoAceptado == 'Rechazado'}
                                       ? 'badge-estat badge-rebutjat'
                                       : 'badge-estat badge-pendent')"
                          th:text="${asistente.estadoAceptado}"></span>
                </td>
                <td>
                    <div class="table-actions">
                        <a th:href="@{/AssistentPersonal/update/{id}(id=${asistente.idAsistente})}"
                           class="btn-edit">Editar</a>
                        <a th:href="@{/AssistentPersonal/delete/{id}(id=${asistente.idAsistente})}"
                           class="btn-delete"
                           onclick="return confirm('Estas segur?')">Eliminar</a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script>
    $(document).ready(function () {
        $('#tablaAsistentes').DataTable({
            language: {
                url: 'https://cdn.datatables.net/plug-ins/1.13.6/i18n/ca.json'
            },
            pageLength: 10,
            columnDefs: [{ orderable: false, targets: 6 }]
        });
    });
</script>
</body>
</html>
