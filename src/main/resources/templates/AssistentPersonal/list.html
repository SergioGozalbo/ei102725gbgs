<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>SgOVI - Assistents Personals</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="table-page">
<nav aria-label="Navegació principal">
    <span class="nav-brand">SgOVI - Administració</span>
    <div class="nav-right">
        <a th:href="@{/dashboard/admin}" class="btn-logout">Tornar al panell</a>
    </div>
</nav>
<main>
    <div th:if="${errorMsg}" class="alert-error" th:text="${errorMsg}"></div>

    <div class="page-actions">
        <div>
            <h1 class="page-title">Assistents Personals</h1>
            <p class="page-subtitle">Llista de tots els assistents registrats.</p>
        </div>
        <a th:href="@{/AssistentPersonal/add}" class="btn-new">+ Nou assistent</a>
    </div>

    <form method="get" th:action="@{/AssistentPersonal/list}"
          style="margin-bottom:1.5rem; display:flex; gap:0.75rem; align-items:center;">
        <input type="text" name="busqueda" th:value="${busqueda}"
               placeholder="Cerca per nom o cognoms..."
               style="max-width:280px;"/>
        <select name="registres" style="max-width:120px;">
            <option value="5"  th:selected="${registres == 5}">5</option>
            <option value="10" th:selected="${registres == 10}">10</option>
            <option value="25" th:selected="${registres == 25}">25</option>
            <option value="50" th:selected="${registres == 50}">50</option>
        </select>
        <button type="submit" class="btn-new">Cercar</button>
        <a th:href="@{/AssistentPersonal/list}" class="btn-back">Netejar</a>
    </form>

    <p th:if="${totalRegistres != null}"
       style="font-size:0.85rem; color:#4b5563; margin-bottom:1rem;"
       th:text="'Mostrant ' + ${#lists.size(asistentes)}
                + ' de ' + ${totalRegistres} + ' registres'"></p>

    <div th:if="${#lists.isEmpty(asistentes)}"
         style="text-align:center; padding:2rem; color:#4b5563;">
        No s'han trobat assistents.
    </div>

    <div class="table-container" th:unless="${#lists.isEmpty(asistentes)}"
         style="max-height:500px; overflow-y:auto;">
        <table>
            <caption class="visually-hidden">Llistat d'assistents personals</caption>
            <thead>
            <tr>
                <th scope="col">Nom i cognoms</th>
                <th scope="col">Email</th>
                <th scope="col">Telèfon</th>
                <th scope="col">Estat</th>
                <th scope="col">Accions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="asistente : ${asistentes}">
                <td th:text="${asistente.nombre} + ' ' + ${asistente.apellidos}"></td>
                <td th:text="${asistente.email}"></td>
                <td th:text="${asistente.telefono}"></td>
                <td>
                    <span class="badge-estat"
                          th:classappend="${asistente.estadoAceptado == 'Aceptado'} ? ' badge-acceptat' :
                                         (${asistente.estadoAceptado == 'Rechazado'} ? ' badge-rebutjat' :
                                         ' badge-pendent')"
                          th:text="${asistente.estadoAceptado}"></span>
                </td>
                <td>
                    <div class="table-actions">
                        <a th:href="@{/AssistentPersonal/update/{id}(id=${asistente.idAsistente})}"
                           class="btn-edit">Editar</a>
                        <a th:href="@{/AssistentPersonal/confirmDelete/{id}(id=${asistente.idAsistente})}"
                           class="btn-delete">Eliminar</a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
