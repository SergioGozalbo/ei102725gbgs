<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SgOVI - Les meues Peticions Acceptades</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="dashboard">
<nav>
    <span class="nav-brand">SgOVI - Assistents</span>
    <div class="nav-right">
        <a th:href="@{/dashboard/assistentPersonal}" class="btn-logout">Tornar al panel</a>
    </div>
</nav>
<main>
    <div class="page-actions">
        <div>
            <h1 class="page-title">Peticions que has acceptat</h1>
            <p class="page-subtitle">Aquí veus l'estat de totes les sol·licituds on t'has postulat</p>
        </div>
        <a th:href="@{/AssistentPersonal/requests}" class="btn-new">
            Buscar més sol·licituds
        </a>
    </div>

    <div class="table-container">
        <div th:if="${#lists.isEmpty(requests)}"
             style="text-align: center; padding: 2rem; color: #6b7280;">
            Encara no has acceptat cap sol·licitud.
        </div>
        <table th:unless="${#lists.isEmpty(requests)}">
            <thead>
            <tr>
                <th>Usuari</th>
                <th>Província</th>
                <th>Estat</th>
                <th>Accions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="req : ${requests}"
                th:classappend="${#lists.contains(solicitudesConContrato, req.idSolicitud)} ? 'fila-bloqueada'">
                <td>
                    <span th:each="u : ${usuarios}"
                          th:if="${u.idUsuario == req.idUsuarioOvi}"
                          th:text="${u.nombre} + ' ' + ${u.apellidos}"></span>
                </td>
                <td th:text="${req.proximidad}"></td>
                <td>
                    <span th:if="${#lists.contains(solicitudesConContrato, req.idSolicitud)}"
                          class="badge-estat badge-acceptat">✓ Escollit per l'usuari</span>
                    <span th:unless="${#lists.contains(solicitudesConContrato, req.idSolicitud)}"
                          class="badge-estat badge-pendent">Pendent de decisió</span>
                </td>
                <td>
                    <div class="table-actions">
                        <a th:unless="${#lists.contains(solicitudesConContrato, req.idSolicitud)}"
                           th:href="@{/AssistentPersonal/cancelRequest/{id}(id=${req.idSolicitud})}"
                           class="btn-delete"
                           onclick="return confirm('Vols cancel·lar la teua candidatura?')">
                            Cancel·lar
                        </a>
                        <span th:if="${#lists.contains(solicitudesConContrato, req.idSolicitud)}"
                              class="text-waiting">—</span>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
