<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<h2>Formadors</h2>

<table>
    <tr>
        <th>Name</th>
        <th>Action</th>
    </tr>

    <tr th:each="f : ${formadors}">
    <td th:text="${f.nombre}"></td>
    <td>
        <a th:href="@{/api/formador/delete/{id}(id=${f.idFormador})}">
            Delete
        </a>
    </td>
    </tr>
</table>

</body>
</html>
