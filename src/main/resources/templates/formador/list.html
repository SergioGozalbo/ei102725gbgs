<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <title>Formadors</title>
</head>
<body>

<main class="container">
    <h1>Formadors</h1>

    <table class="table table-striped">
        <tr>
            <th>Name</th>
            <th>Surname</th>
            <th>Specialty</th>
            <th>Actions</th>
        </tr>

        <tr th:each="f : ${formadors}">
            <td th:text="${f.nombre}"></td>
            <td th:text="${f.apellidos}"></td>
            <td th:text="${f.especialidad}"></td>

            <td>
                <a th:href="@{/api/formador/delete/{id}(id=${f.idFormador})}">
                    Delete
                </a>
            </td>
        </tr>
    </table>
</main>

</body>
</html>
