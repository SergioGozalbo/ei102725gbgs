<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Actualizar usuario</title>
</head>
<body class="form-page">

<div class="form-card">
    <h1 class="page-title">
        Actualizar usuario
    </h1>

    <form th:action="@{/UsuariOVI/update}" th:object="${usuariOVI}" method="post">

        <div class="form-group">
            <label for="idUsuario">Id usuario:</label>
            <input type="text" id="idUsuario" th:field="*{idUsuario}" readonly>
        </div>

        <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" th:field="*{nombre}">
        </div>

        <div class="form-group">
            <label for="apellidos">Apellidos:</label>
            <input type="text" id="apellidos" th:field="*{apellidos}">
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="text" id="email" th:field="*{email}">
        </div>

        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" th:field="*{password}">
        </div>

        <div class="form-group">
            <label for="telefono">Teléfono:</label>
            <input type="text" id="telefono" th:field="*{telefono}">
        </div>

        <div class="checkbox-group">
            <label for="consentimientoRgpd">Consentimiento:</label>
            <input type="checkbox" id="consentimientoRgpd" th:field="*{consentimientoRgpd}">
        </div>

        <button type="submit" class="btn btn-primary">
            Actualizar
        </button>
    </form>

    <a th:href="@{/UsuariOVI/list}"
    class="btn btn-outline">
        Volver a la lista
    </a>
</div>

</body>
</html>
