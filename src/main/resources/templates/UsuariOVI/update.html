<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Actualizar usuario</title>
</head>
<body>

<main>
    <h1>Actualizar usuario</h1>

    <form th:action="@{/UsuariOVI/update}" th:object="${usuariOVI}" method="post">

        <div>
            <label for="idUsuario">Id usuario:</label>
            <input type="text" id="idUsuario" th:field="*{idUsuario}" readonly>
        </div>
        <br>

        <div>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" th:field="*{nombre}">
        </div>
        <br>

        <div>
            <label for="apellidos">Apellidos:</label>
            <input type="text" id="apellidos" th:field="*{apellidos}">
        </div>
        <br>

        <div>
            <label for="email">Email:</label>
            <input type="text" id="email" th:field="*{email}">
        </div>
        <br>

        <div>
            <label for="password">Contraseña:</label>
            <input type="text" id="password" th:field="*{password}">
        </div>
        <br>

        <div>
            <label for="telefono">Teléfono:</label>
            <input type="text" id="telefono" th:field="*{telefono}">
        </div>
        <br>

        <div>
            <label for="consentimientoRgpd">Consentimiento:</label>
            <input type="text" id="consentimientoRgpd" th:field="*{consentimientoRgpd}" readonly>
        </div>
        <br>

        <button type="submit">Actualizar</button>
    </form>

    <br>
    <a th:href="@{/UsuariOVI/list}">Volver a la lista</a>
</main>

</body>
</html>
