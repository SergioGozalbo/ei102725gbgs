<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Actualizar usuario</title>
</head>
<body class="form-page">

<nav>
    <span class="nav-brand">SgOVI</span>

    <div class="nav-right">
        <a th:href="@{/logout}" class="btn-logout">
            Cerrar sesión
        </a>
    </div>
</nav>

<main>

<div class="page-actions">
    <div>
        <h1 class="page-title">
        Actualizar usuario
    </h1>

        <p class="page-subtitle">
            Modifica los datos del usuario.
        </p>
        </div>

    <a th:href="@{/UsuariOVI/list}"
       class="btn-back">
        Volver a la lista
    </a>

    </div>

    <div class="form-card">

    <form th:action="@{/UsuariOVI/update}" th:object="${usuariOVI}" method="post">

        <div class="form-group">
            <label for="idUsuario">Id usuario:</label>
            <input type="text"
                   id="idUsuario"
                   th:field="*{idUsuario}" readonly>
        </div>

        <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input type="text"
                   id="nombre"
                   th:field="*{nombre}"
                   placeholder="Nombre">
        </div>

        <div class="form-group">
            <label for="apellidos">Apellidos:</label>
            <input type="text"
                   id="apellidos"
                   th:field="*{apellidos}"
                   placeholder="Apellidos">
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email"
                   id="email"
                   th:field="*{email}"
                   placeholder="correo@ejemplo.com">
        </div>

        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password"
                   id="password"
                   th:field="*{password}"
                   placeholder="********">
        </div>

        <div class="form-group">
            <label for="telefono">Teléfono:</label>
            <input type="text"
                   id="telefono"
                   th:field="*{telefono}"
                   placeholder="6XXXXXXXX">
        </div>

        <div class="checkbox-group">
            <input type="checkbox"
                   id="consentimientoRgpd"
                   th:field="*{consentimientoRgpd}">
            <label for="consentimientoRgpd">Consentimiento:</label>
        </div>

        <button type="submit" class="btn btn-primary">
            Actualizar
        </button>
    </form>

</div>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>SgOVI - Editar Usuari OVI</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="form-page">
<nav>
    <span class="nav-brand">SgOVI - Administració</span>
    <div class="nav-right">
        <a th:href="@{/UsuariOVI/list}" class="btn-logout">Tornar a la llista</a>
    </div>
</nav>
<main>
    <div class="page-actions">
        <div>
            <h1 class="page-title">Editar Usuari OVI</h1>
            <p class="page-subtitle">Modifica les dades de l'usuari.</p>
        </div>
    </div>
    <div class="form-card">
        <form th:action="@{/UsuariOVI/update}" th:object="${usuariOVI}" method="post">
            <input type="hidden" th:field="*{idUsuario}"/>
            <div class="form-group">
                <label for="nombre">Nom</label>
                <input id="nombre" type="text" th:field="*{nombre}" placeholder="Nom"/>
                <div th:if="${#fields.hasErrors('nombre')}"
                     th:errors="*{nombre}" class="error"></div>
            </div>
            <div class="form-group">
                <label for="apellidos">Cognoms</label>
                <input id="apellidos" type="text" th:field="*{apellidos}"
                       placeholder="Cognoms"/>
                <div th:if="${#fields.hasErrors('apellidos')}"
                     th:errors="*{apellidos}" class="error"></div>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" type="email" th:field="*{email}"
                       placeholder="correu@exemple.com"/>
                <div th:if="${#fields.hasErrors('email')}"
                     th:errors="*{email}" class="error"></div>
            </div>
            <div class="form-group">
                <label for="password">Contrasenya</label>
                <input id="password" type="password" th:field="*{password}"
                       placeholder="••••••••"/>
            </div>
            <div class="form-group">
                <label for="telefono">Telèfon</label>
                <input id="telefono" type="text" th:field="*{telefono}"
                       placeholder="6XXXXXXXX"/>
                <div th:if="${#fields.hasErrors('telefono')}"
                     th:errors="*{telefono}" class="error"></div>
            </div>
            <div class="form-group"
                 style="flex-direction: row; align-items: center; gap: 0.75rem;">
                <input type="checkbox" id="consentimientoRgpd"
                       th:field="*{consentimientoRgpd}"
                       style="width: auto; margin: 0;"/>
                <label for="consentimientoRgpd" style="margin: 0;">
                    Accepte el tractament de dades (RGPD)
                </label>
            </div>
            <div style="display:flex; gap:1rem; margin-top:1.5rem;">
                <button type="submit" class="btn btn-primary"
                        style="flex:1;">Actualitzar</button>
                <a th:href="@{/UsuariOVI/list}" class="btn btn-outline"
                   style="flex:1; text-align:center;">Cancel·lar</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
