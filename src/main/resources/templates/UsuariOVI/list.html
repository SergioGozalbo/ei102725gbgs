<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>SgOVI - Usuaris OVI</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="table-page">
<nav>
    <span class="nav-brand">SgOVI - Administració</span>
    <div class="nav-right">
        <a th:href="@{/logout}" class="btn-logout">Tancar sessió</a>
    </div>
</nav>
<main>
    <div th:if="${errorMsg}" class="alert-error" th:text="${errorMsg}"></div>

    <div class="page-actions">
        <div>
            <h1 class="page-title">Usuaris OVI</h1>
            <p class="page-subtitle">Llista de tots els usuaris registrats.</p>
        </div>
        <div style="display:flex; gap:0.75rem;">
            <a th:href="@{/UsuariOVI/add}" class="btn-new">+ Nou usuari</a>
            <a th:href="@{/dashboard/admin}" class="btn-back">Tornar al panell</a>
        </div>
    </div>

    <form method="get" th:action="@{/UsuariOVI/list}"
          style="margin-bottom:1.5rem; display:flex; gap:0.75rem;
                 align-items:center; flex-wrap:wrap;">
        <input type="text" name="busqueda" th:value="${busqueda}"
               placeholder="Cerca per nom o cognoms..."
               style="max-width:280px;"/>
        <button type="submit" class="btn-new">Cercar</button>
        <a th:href="@{/UsuariOVI/list}" class="btn-back">Netejar</a>
    </form>

    <p style="font-size:0.85rem; color:#4b5563; margin-bottom:1rem;"
       th:text="'Mostrant ' + ${#lists.size(usuarios)}
                + ' de ' + ${totalRegistres} + ' registres'"></p>

    <div th:if="${#lists.isEmpty(usuarios)}"
         style="text-align:center; padding:2rem; color:#4b5563;">
        No s'han trobat usuaris.
    </div>

    <div class="table-container" th:unless="${#lists.isEmpty(usuarios)}">
        <table>
            <caption class="visually-hidden">Llistat d'usuaris OVI</caption>
            <thead>
            <tr>
                <th scope="col">Nom i cognoms</th>
                <th scope="col">Email</th>
                <th scope="col">Telèfon</th>
                <th scope="col">Accions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="usuario : ${usuarios}">
                <td th:text="${usuario.nombre} + ' ' + ${usuario.apellidos}"></td>
                <td th:text="${usuario.email}"></td>
                <td th:text="${usuario.telefono}"></td>
                <td>
                    <div class="table-actions">
                        <a th:href="@{/UsuariOVI/update/{id}(id=${usuario.idUsuario})}"
                           class="btn-edit">Editar</a>
                        <a th:href="@{/UsuariOVI/confirmDelete/{id}(id=${usuario.idUsuario})}"
                           class="btn-delete">Eliminar</a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Paginació -->
    <div th:if="${totalPagines > 1}"
         style="display:flex; gap:0.5rem; align-items:center;
                margin-top:1.5rem; justify-content:center;">
        <a th:if="${paginaActual > 0}"
           th:href="@{/UsuariOVI/list(busqueda=${busqueda},
                      pagina=${paginaActual - 1})}"
           class="btn-back">← Anterior</a>
        <span th:each="i : ${#numbers.sequence(0, totalPagines - 1)}">
            <a th:if="${i != paginaActual}"
               th:href="@{/UsuariOVI/list(busqueda=${busqueda}, pagina=${i})}"
               class="btn-back"
               th:text="${i + 1}"></a>
            <span th:if="${i == paginaActual}"
                  class="btn-new"
                  th:text="${i + 1}"
                  style="cursor:default;"></span>
        </span>
        <a th:if="${paginaActual < totalPagines - 1}"
           th:href="@{/UsuariOVI/list(busqueda=${busqueda},
                      pagina=${paginaActual + 1})}"
           class="btn-back">Següent →</a>
    </div>
</main>
</body>
</html>
