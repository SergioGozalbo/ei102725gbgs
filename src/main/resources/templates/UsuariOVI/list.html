<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista usuarios</title>
</head>
<body>

<main>

<table border="1">
    <thead>
    <tr>
    <th>id</th>
    <th>Nombre</th>
    <th>Apellidos</th>
    <th>Email</th>
    <th>Contraseña</th>
    <th>teléfono</th>
        <th>Confirmación RGPD</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="usuario : ${usuariOVI}">
        <td th:text="${usuario.idUsuario}"></td>
        <td th:text="${usuario.nombre}"></td>
        <td th:text="${usuario.apellidos}"></td>
        <td th:text="${usuario.email}"></td>
        <td th:text="${usuario.password}"></td>
        <td th:text="${usuario.telefono}"></td>
        <td th:text="${usuario.consentimientoRgpd ? 'Si' : 'No'}"></td>
        <td>
            <a th:href="@{/UsuariOVI/update/{id}(id=${usuario.id})}">Edita</a>

            <a th:href="@{/UsuariOVI/delete/{id}(id=${usuario.id})}">Esborra</a>
        </td>
    </tr>
    </tbody>
    </table>
    <a href="UsuariOVI/add">Afegeix usuario</a>
<br><br>
<a href="/">Tornar</a>
</main>
</body>
</html>
