<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<main>

<table>
    <thead>
    <tr>
    <th>id</th>
    <th>name</th>
    <th>surname</th>
    <th>email</th>
    <th>password</th>
    <th>telefono</th>
        <th>RGPD</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="usuario : ${usuarios}">
        <td th:text="${usuario.idUsuario}"></td>
        <td th:text="${usuario.nombre}"></td>
        <td th:text="${usuario.apellidos}"></td>
        <td th:text="${usuario.email}"></td>
        <td th:text="${usuario.password}"></td>
        <td th:text="${usuario.telefono}"></td>
        <td th:text="${usuario.consentimientoRgpd ? 'Si' : 'No'}"></td>
        <td>
            <a th:href="@{/usuario/update/{id}(id=${usuario.id})}">Edita</a>
            |
            <a th:href="@{/usuario/delete/{id}(id=${usuario.id})}">Esborra</a>
        </td>
    </tr>
    </tbody>
    </table>
    <a href="add">Afegeix usuario</a>
<br><br>
<a href="/">Tornar</a>
</main>
</body>
</html>
