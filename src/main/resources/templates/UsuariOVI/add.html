<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<main>
    <h1>Afgeix usuari</h1>

    <form th:action="@{/usuario/add}" th:object="${usuario}" method="post">

        <div>
            <label for="idUsuario">Id usuari:</label>
            <input type="text" id="idUsuario" th:field="*{idUsuario}">
        </div>
        <br>

        <div>
            <label for="nombre">Nom:</label>
            <input type="text" id="nombre" th:field="*{nombre}">
        </div>
        <br>

        <button type="submit">Guardar</button>
    </form>

    <br>
    <a th:href="@{/usuario/list}">Tornar a la llista</a>
</main>

</body>
</html>
