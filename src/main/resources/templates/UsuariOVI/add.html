<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Añadir usuario</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="form-card">
    <div class="header">

        <div class="logo">
            <span style="color:white;
                         font-weight:bold;
                         font-size:1.5rem;">+</span>
        </div>
    </div>

    <h1>Añadir usuario</h1>

    <p class="subtitle">
       Registra un nuevo usuario OVI
    </p>

    </div>

    <form th:action="@{/UsuariOVI/add}" th:object="${usuariOVI}" method="post">

        <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" th:field="*{nombre}">
            <span th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" style="color:red;"></span>
        </div>
        <div class="form-group">
            <label for="apellidos">Apellidos:</label>
            <input type="text" id="apellidos" th:field="*{apellidos}">
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="text" id="email" th:field="*{email}">
        </div>

        <div class="form-group">
            <label for="password">Contreaseña:</label>
            <input type="text" id="password" th:field="*{password}">
        </div>

        <div class="form-group">
            <label for="telefono">Teléfono:</label>
            <input type="text" id="telefono" th:field="*{telefono}">
            <span th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}" style="color:red;"></span>
        </div>

        <div class="checkbox-group">
            <label for="consentimientoRgpd">Accepto el tractament de dades (RGPD):</label>
            <input type="checkbox" id="consentimientoRgpd" th:field="*{consentimientoRgpd}">
            <span th:if="${#fields.hasErrors('consentimientoRgpd')}" th:errors="*{consentimientoRgpd}" style="color:red;"></span>
        </div>
        <button type="submit" class="btn btn-primary">
            Guardar
        </button>
    </form>

    <br>
    <a th:href="@{/UsuariOVI/list}"
    class="btn btn-outline">Volver a la lista</a>
</div>

</body>
</html>
