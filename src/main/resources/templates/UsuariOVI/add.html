<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>SgOVI - Nou Usuari OVI</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="form-page">
<nav>
    <span class="nav-brand">SgOVI - Administració</span>
    <div class="nav-right">
        <a th:href="@{/logout}" class="btn-logout">Tancar sessió</a>
    </div>
</nav>
<main>
    <div class="page-actions">
        <div>
            <h1 class="page-title">Nou Usuari OVI</h1>
            <p class="page-subtitle">Omple les dades per registrar un nou usuari.</p>
        </div>
    </div>
    <div class="form-card">
        <form th:action="@{/UsuariOVI/add}" th:object="${usuariOVI}" method="post">
            <div class="form-group">
                <label for="nombre">Nom</label>
                <input id="nombre" type="text" th:field="*{nombre}" placeholder="Nom"/>
                <span th:if="${#fields.hasErrors('nombre')}"
                      th:errors="*{nombre}" class="error"></span>
            </div>
            <div class="form-group">
                <label for="apellidos">Cognoms</label>
                <input id="apellidos" type="text" th:field="*{apellidos}"
                       placeholder="Cognoms"/>
                <span th:if="${#fields.hasErrors('apellidos')}"
                      th:errors="*{apellidos}" class="error"></span>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" type="email" th:field="*{email}"
                       placeholder="correu@exemple.com"/>
                <span th:if="${#fields.hasErrors('email')}"
                      th:errors="*{email}" class="error"></span>
            </div>
            <div class="form-group">
                <label for="password">Contrasenya</label>
                <input id="password" type="password" th:field="*{password}"
                       placeholder="••••••••"/>
                <span th:if="${#fields.hasErrors('password')}"
                      th:errors="*{password}" class="error"></span>
            </div>
            <div class="form-group">
                <label for="telefono">Telèfon</label>
                <input id="telefono" type="text" th:field="*{telefono}"
                       placeholder="6XXXXXXXX"/>
                <span th:if="${#fields.hasErrors('telefono')}"
                      th:errors="*{telefono}" class="error"></span>
            </div>
            <div class="form-group"
                 style="flex-direction:row; align-items:center; gap:0.75rem;">
                <input type="checkbox" id="consentimientoRgpd"
                       th:field="*{consentimientoRgpd}"
                       style="width:auto; margin:0;"/>
                <label for="consentimientoRgpd" style="margin:0;">
                    Accepte el tractament de dades (RGPD)
                </label>
                <span th:if="${#fields.hasErrors('consentimientoRgpd')}"
                      th:errors="*{consentimientoRgpd}" class="error"></span>
            </div>
            <div style="display:flex; gap:1rem; margin-top:1.5rem;">
                <button type="submit" class="btn btn-primary"
                        style="flex:1;">Guardar</button>
                <a th:href="@{/UsuariOVI/list}" class="btn btn-outline"
                   style="flex:1; text-align:center;">Cancel·lar</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
