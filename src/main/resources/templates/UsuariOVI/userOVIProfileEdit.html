<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>SgOVI - Editar perfil</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>

<body>

<main>

<div class="card" style="max-width: 560px;">
    <div class="header">
        <div class="logo">
            <svg width="32" height="32" fill="none" viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4" fill="#ffffff"/>
                <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="#ffffff"
                      stroke-width="2" stroke-linecap="round"/>
            </svg>
        </div>
        <h1>Editar perfil</h1>
        <p class="subtitle">Modifica les teues dades personals</p>
    </div>

    <form th:action="@{/UsuariOVI/profileEdit}"
          th:object="${usuariOVI}" method="post">

        <input type="hidden" th:field="*{idUsuario}"/>
        <input type="hidden" th:field="*{password}"/>

        <div class="form-group">
            <label for="nombre">Nom</label>
            <input id="nombre"
                   type="text"
                   th:field="*{nombre}"
                   placeholder="El teu nom"/>
            <div th:if="${#fields.hasErrors('nombre')}"
                 th:errors="*{nombre}" class="error"></div>
        </div>

        <div class="form-group">
            <label for="apellidos">Cognoms</label>
            <input id="apellidos"
                   type="text"
                   th:field="*{apellidos}"
                   placeholder="Apellidos"/>
            <div th:if="${#fields.hasErrors('apellidos')}"
                 th:errors="*{apellidos}" class="error"></div>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input id="email"
                   type="email"
                   th:field="*{email}"
                   placeholder="correo@ejemplo.com"/>
            <div th:if="${#fields.hasErrors('email')}"
                 th:errors="*{email}" class="error"></div>
        </div>

        <div class="form-group">
            <label for="telefono">Telèfon</label>
            <input id="telefono"
                   type="tel"
                   th:field="*{telefono}"
                   placeholder="6XXXXXXXX"/>
            <div th:if="${#fields.hasErrors('telefono')}"
                 th:errors="*{telefono}" class="error"></div>
        </div>

        <div class="checkbox-group">
            <input id="consentimientoRgpd"
                   type="checkbox"
                   th:field="*{consentimientoRgpd}"/>
            <label for="consentimientoRgpd">
                Accepte el tractament de les meues dades personals (RGPD)
            </label>
        </div>
        <div th:if="${#fields.hasErrors('consentimientoRgpd')}"
             th:errors="*{consentimientoRgpd}" class="error"></div>

        <div class="divider"></div>

        <button type="submit" class="btn btn-primary">Guardar canvis</button>
        <a th:href="@{/UsuariOVI/profile}" class="btn btn-outline">
            Cancel·lar
        </a>
    </form>
</div>
</main>
</body>
</html>
