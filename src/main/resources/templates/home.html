<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>SgOVI</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"/>
</head>
<body class="bg-light">
<main class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow p-5 text-center" style="width: 100%; max-width: 480px;">
        <h1 class="h3 mb-2">SgOVI</h1>
        <p class="text-muted mb-4">Sistema de Gestió d'OVI</p>

        <div class="d-grid gap-3">
            <a th:href="@{/login}" class="btn btn-primary btn-lg">
                Iniciar sessió
            </a>
            <a th:href="@{/registro}" class="btn btn-outline-primary btn-lg">
                Crear un compte
            </a>
        </div>
    </div>
</main>
</body>
</html>
