<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>SgOVI</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<main>
<div class="card" style="max-width: 420px; text-align: center;">
    <div class="header">
        <div class="logo">
            <svg width="34" height="34" viewBox="0 0 32 32" fill="none">
                <circle cx="12" cy="9" r="4" fill="white"/>
                <circle cx="22" cy="9" r="3" fill="white" opacity="0.5"/>
                <path d="M4 24c0-4.418 3.582-8 8-8s8 3.582 8 8" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M22 18c2.761 0 5 2.239 5 5" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
            </svg>
        </div>
        <h1>SgOVI</h1>
        <p class="subtitle">Sistema de Gestión de Asistencia Personal</p>
    </div>

    <a th:href="@{/login}" class="btn btn-primary">Iniciar sesión</a>
    <a th:href="@{/registro}" class="btn btn-outline">Crear una cuenta</a>
</div>
</main>
</body>
</html>
