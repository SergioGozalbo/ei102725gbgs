<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>SgOVI - Contractes</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="table-page">
<nav>
    <span class="nav-brand">SgOVI - Administració</span>
    <div class="nav-right">
        <a th:href="@{/logout}" class="btn-logout">Tancar sessió</a>
    </div>
</nav>
<main>
    <div class="page-actions">
        <div>
            <h1 class="page-title">Contractes actius</h1>
            <p class="page-subtitle">Tots els contractes generats al sistema.</p>
        </div>
        <a th:href="@{/APRequest/list}" class="btn-back">Tornar a sol·licituds</a>
    </div>

    <form method="get" th:action="@{/APRequest/contratos}"
          style="margin-bottom:1.5rem; display:flex; gap:0.75rem;
                 align-items:center; flex-wrap:wrap;">
        <input type="text" name="busqueda" th:value="${busqueda}"
               placeholder="Cerca per nom d'usuari o assistent..."
               style="max-width:300px;"/>
        <button type="submit" class="btn-new">Cercar</button>
        <a th:href="@{/APRequest/contratos}" class="btn-back">Netejar</a>
    </form>

    <p style="font-size:0.85rem; color:#4b5563; margin-bottom:1rem;"
       th:text="'Mostrant ' + ${#lists.size(contratos)}
                + ' de ' + ${totalRegistres} + ' registres'"></p>

    <div th:if="${#lists.isEmpty(contratos)}"
         style="text-align:center; padding:2rem; color:#4b5563;">
        No hi ha contractes registrats.
    </div>

    <div class="table-container" th:unless="${#lists.isEmpty(contratos)}">
        <table>
            <caption class="visually-hidden">Llistat de contractes actius</caption>
            <thead>
            <tr>
                <th scope="col">Usuari OVI</th>
                <th scope="col">Assistent</th>
                <th scope="col">Tipus</th>
                <th scope="col">Província</th>
                <th scope="col">Data inici</th>
                <th scope="col">Data fi</th>
                <th scope="col">Accions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row : ${contratos}">
                <td th:text="${row.usuari != null}
                    ? ${row.usuari.nombre} + ' ' + ${row.usuari.apellidos}
                    : '—'"></td>
                <td th:text="${row.assistent != null}
                    ? ${row.assistent.nombre} + ' ' + ${row.assistent.apellidos}
                    : '—'"></td>
                <td th:text="${row.solicitud != null}
                    ? ${row.solicitud.tipoAsistencia} : '—'"></td>
                <td th:text="${row.solicitud != null}
                    ? ${row.solicitud.proximidad} : '—'"></td>
                <td th:text="${row.contrato.fechaInicio}"></td>
                <td th:text="${row.contrato.fechaFin != null}
                    ? ${row.contrato.fechaFin} : 'Indefinida'"></td>
                <td>
                    <a th:href="@{/APRequest/contratoPdf/{id}(id=${row.contrato.idContrato})}"
                       class="btn-edit">Veure PDF</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Paginació -->
    <div th:if="${totalPagines > 1}"
         style="display:flex; gap:0.5rem; align-items:center;
                margin-top:1.5rem; justify-content:center;">
        <a th:if="${paginaActual > 0}"
           th:href="@{/APRequest/contratos(busqueda=${busqueda},
                      pagina=${paginaActual - 1})}"
           class="btn-back">← Anterior</a>
        <span th:each="i : ${#numbers.sequence(0, totalPagines - 1)}">
            <a th:if="${i != paginaActual}"
               th:href="@{/APRequest/contratos(busqueda=${busqueda}, pagina=${i})}"
               class="btn-back" th:text="${i + 1}"></a>
            <span th:if="${i == paginaActual}"
                  class="btn-new" th:text="${i + 1}"
                  style="cursor:default;"></span>
        </span>
        <a th:if="${paginaActual < totalPagines - 1}"
           th:href="@{/APRequest/contratos(busqueda=${busqueda},
                      pagina=${paginaActual + 1})}"
           class="btn-back">Següent →</a>
    </div>
</main>
</body>
</html>
