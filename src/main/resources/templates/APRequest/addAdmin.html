<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>SgOVI - Nueva Solicitud</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="form-page">
<nav>
  <span class="nav-brand">SgOVI - Administración</span>
  <div class="nav-right">
    <a th:href="@{/APRequest/list}" class="btn-logout">Volver a la lista</a>
  </div>
</nav>
<main>
  <h1 class="page-title">Nueva Solicitud de Asistencia</h1>
  <p class="page-subtitle">Crea una nueva solicitud para un usuario OVI.</p>

  <div class="form-card">
    <form th:action="@{/APRequest/addAdmin}" th:object="${apRequest}" method="post">

      <div class="form-group">
        <label for="idUsuarioOvi">Usuario OVI</label>
        <select id="idUsuarioOvi" th:field="*{idUsuarioOvi}">
          <option value="">-- Selecciona un usuario --</option>
          <option th:each="u : ${usuariosOvi}"
                  th:value="${u.idUsuario}"
                  th:text="${u.nombre} + ' ' + ${u.apellidos}"></option>
        </select>
        <div th:if="${#fields.hasErrors('idUsuarioOvi')}"
             th:errors="*{idUsuarioOvi}" class="error"></div>
      </div>

      <div class="form-group">
        <label for="tipoAsistencia">Tipo de Asistencia</label>
        <select id="tipoAsistencia" th:field="*{tipoAsistencia}">
          <option value="">-- Selecciona --</option>
          <option value="PAP">PAP</option>
          <option value="PATI">PATI</option>
        </select>
        <div th:if="${#fields.hasErrors('tipoAsistencia')}"
             th:errors="*{tipoAsistencia}" class="error"></div>
      </div>

      <div class="form-group">
        <label for="proximidad">Provincia</label>
        <select id="proximidad" th:field="*{proximidad}">
          <option value="">-- Selecciona --</option>
          <option th:each="p : ${provincias}"
                  th:value="${p}" th:text="${p}"></option>
        </select>
      </div>

      <div class="form-group">
        <label for="preferencias">Preferencias</label>
        <textarea id="preferencias" th:field="*{preferencias}"
                  rows="4" placeholder="Describe las preferencias..."></textarea>
      </div>

      <input type="hidden" th:field="*{estado}"/>

      <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
        <button type="submit" class="btn btn-primary" style="flex: 1;">Guardar</button>
        <a th:href="@{/APRequest/list}" class="btn btn-outline" style="flex: 1; text-align: center;">Cancelar</a>
      </div>
    </form>
  </div>
</main>
</body>
</html>
