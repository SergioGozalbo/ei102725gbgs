<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>SgOVI - Nova Sol·licitud</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="form-page">
<nav>
  <span class="nav-brand">SgOVI - Administració</span>
  <div class="nav-right">
    <a th:href="@{/logout}" class="btn-logout">Tancar sessió</a>
  </div>
</nav>
<main>
  <div class="page-actions">
    <div>
      <h1 class="page-title">Nova Sol·licitud d'Assistència</h1>
      <p class="page-subtitle">Crea una nova sol·licitud per a un usuari OVI.</p>
    </div>
    <a th:href="@{/APRequest/list}" class="btn-back">Tornar a la llista</a>
  </div>
  <div class="form-card">
    <form th:action="@{/APRequest/addAdmin}" th:object="${apRequest}" method="post">
      <div class="form-group">
        <label for="idUsuarioOvi">Usuari OVI</label>
        <select id="idUsuarioOvi" th:field="*{idUsuarioOvi}">
          <option value="">-- Selecciona un usuari --</option>
          <option th:each="u : ${usuariosOvi}"
                  th:value="${u.idUsuario}"
                  th:text="${u.nombre} + ' ' + ${u.apellidos}"></option>
        </select>
        <span th:if="${#fields.hasErrors('idUsuarioOvi')}"
              th:errors="*{idUsuarioOvi}" class="error"></span>
      </div>
      <div class="form-group">
        <label for="tipoAsistencia">Tipus d'assistència</label>
        <select id="tipoAsistencia" th:field="*{tipoAsistencia}">
          <option value="">-- Selecciona --</option>
          <option value="PAP">PAP</option>
          <option value="PATI">PATI</option>
        </select>
        <span th:if="${#fields.hasErrors('tipoAsistencia')}"
              th:errors="*{tipoAsistencia}" class="error"></span>
      </div>
      <div class="form-group">
        <label for="proximidad">Província</label>
        <select id="proximidad" th:field="*{proximidad}">
          <option value="">-- Selecciona --</option>
          <option th:each="p : ${provincias}"
                  th:value="${p}" th:text="${p}"></option>
        </select>
        <span th:if="${#fields.hasErrors('proximidad')}"
              th:errors="*{proximidad}" class="error"></span>
      </div>
      <div class="form-group">
        <label for="preferencias">Preferències</label>
        <textarea id="preferencias" th:field="*{preferencias}" rows="4"
                  placeholder="Descriu les preferències..."></textarea>
      </div>
      <input type="hidden" th:field="*{estado}"/>
      <div style="display:flex; gap:1rem; margin-top:1.5rem;">
        <button type="submit" class="btn btn-primary"
                style="flex:1;">Guardar</button>
        <a th:href="@{/APRequest/list}" class="btn btn-outline"
           style="flex:1; text-align:center;">Cancel·lar</a>
      </div>
    </form>
  </div>
</main>
</body>
</html>
