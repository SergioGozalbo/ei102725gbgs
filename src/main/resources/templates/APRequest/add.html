<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Añadir solicitud</title>
</head>
<body>
<main>
    <h1>Añadir solicitud</h1>
    <form th:action="@{/APRequest/add}" th:object="${apRequest}" method="post">

        <div>
            <label for="idUsuarioOvi">Usuario OVI:</label>
            <select id="idUsuarioOvi" th:field="*{idUsuarioOvi}">
                <option th:each="user : ${usuariosOvi}"
                        th:value="${user.idUsuario}"
                        th:text="${user.idUsuario} + ' - ' + ${user.nombre}"></option>
            </select>
        </div>
        <br>

        <div>
            <label for="tipoAsistencia">Tipo Asistencia:</label>
            <select id="tipoAsistencia" th:field="*{tipoAsistencia}">
                <option value="PAP">PAP</option>
                <option value="PATI">PATI</option>
            </select>
        </div>
        <br>

        <div>
            <label for="proximidad">Provincia (Proximidad):</label>
            <select id="proximidad" th:field="*{proximidad}">
                <option th:each="prov : ${provincias}"
                        th:value="${prov}"
                        th:text="${prov}"></option>
            </select>
        </div>
        <br>

        <div>
            <label for="preferencias">Preferencias:</label><br>
            <textarea id="preferencias" th:field="*{preferencias}" rows="3" cols="40"></textarea>
        </div>

        <!-- El estado y el ID se gestionan internamente -->
        <input type="hidden" th:field="*{estado}">

        <br>
        <button type="submit">Guardar</button>
    </form>
    <br>
    <a th:href="@{/APRequest/list}">Volver a la lista</a>
</main>
</body>
</html>
