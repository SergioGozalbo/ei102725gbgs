<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SgOVI - Nueva Solicitud</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="form-page">
<nav>
    <span class="nav-brand">SgOVI</span>
    <div class="nav-right">
        <a th:href="@{/logout}" class="btn-logout">Cerrar sesión</a>
    </div>
</nav>

<main>
    <div class="page-actions">
        <div>
            <h1 class="page-title">Nueva Solicitud</h1>
            <p class="page-subtitle">Indica el tipo de asistencia que necesitas.</p>
        </div>
    </div>

    <div class="form-card">
        <form th:action="@{/APRequest/add}" th:object="${apRequest}" method="post">
            <input type="hidden" th:field="*{idUsuarioOvi}"/>
            <input type="hidden" th:field="*{estado}"/>

            <div class="form-group">
                <label for="tipoAsistencia">Tipo de Asistencia</label>
                <select id="tipoAsistencia" th:field="*{tipoAsistencia}">
                    <option value="">-- Selecciona --</option>
                    <option value="PAP">PAP (Personal)</option>
                    <option value="PATI">PATI (Técnica)</option>
                </select>
                <div class="error" th:if="${#fields.hasErrors('tipoAsistencia')}"
                     th:errors="*{tipoAsistencia}"></div>
            </div>

            <div class="form-group">
                <label for="proximidad">Provincia</label>
                <select id="proximidad" th:field="*{proximidad}">
                    <option value="">-- Selecciona provincia --</option>
                    <option th:each="prov : ${provincias}"
                            th:value="${prov}" th:text="${prov}"></option>
                </select>
                <div class="error" th:if="${#fields.hasErrors('proximidad')}"
                     th:errors="*{proximidad}"></div>
            </div>

            <div class="form-group">
                <label for="preferencias">Preferencias y detalles</label>
                <textarea id="preferencias" th:field="*{preferencias}" rows="3"
                          placeholder="Explica brevemente tus necesidades..."></textarea>
                <div class="error" th:if="${#fields.hasErrors('preferencias')}"
                     th:errors="*{preferencias}"></div>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">Crear solicitud</button>
                <a th:href="@{/APRequest/mylist}" class="btn btn-outline"
                   style="flex: 1; text-align: center;">Cancelar</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
