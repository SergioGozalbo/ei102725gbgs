<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>SgOVI - Les meues Sol·licituds</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="dashboard">
<nav>
    <span class="nav-brand">SgOVI</span>
    <div class="nav-right">
        <span class="nav-user" th:text="'Benvingut, ' + ${usuari.nombre}"></span>
        <a th:href="@{/logout}" class="btn-logout">Tancar sessió</a>
    </div>
</nav>

<main>
    <h1 class="page-title">Les meues sol·licituds</h1>
    <p class="page-subtitle">Consulta i gestiona l'estat de les teues peticions.</p>

    <div th:if="${#lists.isEmpty(requests)}" class="alert-error" style="background: #e0f2fe; border-color: #7dd3fc; color: #0369a1;">
        No tens cap sol·licitud activa.
    </div>

    <div class="dashboard-card" style="padding: 0; overflow: hidden; max-width: 100%;">
        <table style="width: 100%; border-collapse: collapse;">
            <thead style="background: #f8fafc; border-bottom: 2px solid #e5e7eb;">
            <tr>
                <th style="padding: 1rem; text-align: left;">Tipus</th>
                <th style="padding: 1rem; text-align: left;">Estat</th>
                <th style="padding: 1rem; text-align: left;">Província</th>
                <th style="padding: 1rem; text-align: left;">Preferències</th>
                <th style="padding: 1rem; text-align: center;">Accions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="request : ${requests}" style="border-bottom: 1px solid #f1f5f9;">
                <td style="padding: 1rem;" th:text="${request.tipoAsistencia}"></td>
                <td style="padding: 1rem;">
                            <span th:class="${request.estado == 'Aprobada' or request.estado == 'aprobada'} ? 'badge-estat badge-acceptat' : 'badge-estat badge-pendent'"
                                  th:text="${request.estado}"></span>
                </td>
                <td style="padding: 1rem;" th:text="${request.proximidad}"></td>
                <td style="padding: 1rem;" th:text="${request.preferencias}"></td>
                <td style="padding: 1rem; text-align: center;">
                    <!-- Solo mostrar editar/borrar si no tiene contrato -->
                    <span th:if="${asistenteElegido[request.idSolicitud] == null}">
        <a th:href="@{/APRequest/update/{id}(id=${request.idSolicitud})}"
           style="color: #1a56db; text-decoration: none; font-weight: 600; margin-right: 10px;">
            Editar
        </a>
        <a th:href="@{/APRequest/delete/{id}(id=${request.idSolicitud})}"
           style="color: #dc2626; text-decoration: none; font-weight: 600; margin-right: 10px;"
           onclick="return confirm('Estàs segur que vols esborrar esta sol·licitud?')">
            Esborrar
        </a>
    </span>

                    <!-- Botón candidatos: solo si está Aprobada y sin contrato -->
                    <a th:if="${request.estado == 'Aprobada' and asistenteElegido[request.idSolicitud] == null}"
                       th:href="@{/APRequest/mylistChooseAP/{id}(id=${request.idSolicitud})}"
                       class="btn-card" style="background: #059669;">
                        Ver Candidatos
                    </a>

                    <!-- Si ya tiene contrato: mostrar quién fue elegido con enlace a detalles -->
                    <span th:if="${asistenteElegido[request.idSolicitud] != null}"
                          style="display: inline-flex; align-items: center; gap: 0.5rem;">
        <span class="badge-estat badge-acceptat">✓ Candidat escollit</span>
        <a th:href="@{/APRequest/mylistChooseAPDetails/{idSolicitud}/{idAsistente}
            (idSolicitud=${request.idSolicitud},
             idAsistente=${asistenteElegido[request.idSolicitud]})}"
           style="color: #166534; font-weight: 600; text-decoration: none; font-size: 0.85rem;">
            Veure detalls
        </a>
        <a th:href="@{/chat/{id}(id=${request.idSolicitud})}"
        class="btn-card" style="background: #059669; font-size: 0.85rem;">
          Enviar missatge
        </a>
    </span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div style="margin-top: 2rem; display: flex; gap: 1rem;">
        <a th:href="@{/APRequest/add}" class="btn-card">+ Nova Sol·licitud</a>
        <a th:href="@{/dashboard/usuariOVI}" class="btn-card" style="background: #6b7280;">Tornar al Panel</a>
    </div>
</main>
</body>
</html>
