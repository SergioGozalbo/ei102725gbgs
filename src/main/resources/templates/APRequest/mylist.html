<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <meta charset="UTF-8"/>
    <title>SgOVI - Les meues Sol·licituds</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet"
          href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css"/>
</head>
<body class="dashboard">
<nav>
    <span class="nav-brand">SgOVI</span>
    <div class="nav-right">
        <span class="nav-user"
              th:text="'Benvingut, ' + ${usuari.nombre}"></span>
        <a th:href="@{/logout}" class="btn-logout">Tancar sessió</a>
    </div>
</nav>
<main>
    <h1 class="page-title">Les meues sol·licituds</h1>
    <p class="page-subtitle">Consulta i gestiona l'estat de les teues peticions.</p>

    <div th:if="${#lists.isEmpty(requests)}"
         style="background:#e0f2fe; border-color:#7dd3fc; color:#0369a1;
                border-radius:10px; padding:1rem 1.2rem; margin-bottom:1.5rem;">
        No tens cap sol·licitud activa.
    </div>

    <div class="table-container"
         th:unless="${#lists.isEmpty(requests)}"
         style="padding:0; overflow:hidden; max-width:100%;">
        <table id="tablaMylist" style="width:100%; border-collapse:collapse;">
            <thead style="background:#f8fafc; border-bottom:2px solid #e5e7eb;">
            <tr>
                <th style="padding:1rem; text-align:left;">Tipus</th>
                <th style="padding:1rem; text-align:left;">Estat</th>
                <th style="padding:1rem; text-align:left;">Província</th>
                <th style="padding:1rem; text-align:left;">Preferències</th>
                <th style="padding:1rem; text-align:center;">Accions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="request : ${requests}"
                style="border-bottom:1px solid #f1f5f9;">
                <td style="padding:1rem;"
                    th:text="${request.tipoAsistencia}"></td>
                <td style="padding:1rem;">
                    <span th:class="${request.estado == 'Aprobada' or request.estado == 'aprobada'}
                                    ? 'badge-estat badge-acceptat'
                                    : 'badge-estat badge-pendent'"
                          th:text="${request.estado}"></span>
                </td>
                <td style="padding:1rem;"
                    th:text="${request.proximidad}"></td>
                <td style="padding:1rem;"
                    th:text="${request.preferencias}"></td>
                <td style="padding:1rem; text-align:center;">
                    <span th:if="${asistenteElegido[request.idSolicitud] == null}">
                        <a th:href="@{/APRequest/update/{id}(id=${request.idSolicitud})}"
                           style="color:#1a56db; text-decoration:none;
                                  font-weight:600; margin-right:10px;">
                            Editar</a>
                        <a th:href="@{/APRequest/delete/{id}(id=${request.idSolicitud})}"
                           style="color:#dc2626; text-decoration:none;
                                  font-weight:600; margin-right:10px;"
                           onclick="return confirm('Estàs segur que vols esborrar esta sol·licitud?')">
                            Esborrar</a>
                    </span>
                    <a th:if="${request.estado == 'Aprobada'
                               and asistenteElegido[request.idSolicitud] == null}"
                       th:href="@{/APRequest/mylistChooseAP/{id}(id=${request.idSolicitud})}"
                       class="btn-card" style="background:#059669;">
                        Veure candidats</a>
                    <span th:if="${asistenteElegido[request.idSolicitud] != null}"
                          style="display:inline-flex; align-items:center; gap:0.5rem;">
                        <span class="badge-estat badge-acceptat">✓ Candidat escollit</span>
                        <a th:href="@{/APRequest/mylistChooseAPDetails/{idSolicitud}/{idAsistente}
                            (idSolicitud=${request.idSolicitud},
                             idAsistente=${asistenteElegido[request.idSolicitud]})}"
                           style="color:#166534; font-weight:600;
                                  text-decoration:none; font-size:0.85rem;">
                            Veure detalls</a>
                        <a th:href="@{/APRequest/contrato/{id}(id=${request.idSolicitud})}"
                           class="btn-edit" target="_blank"
                           style="font-size:0.85rem;">Contracte</a>
                        <a th:href="@{/chat/{id}(id=${request.idSolicitud})}"
                           class="btn-card"
                           style="background:#059669; font-size:0.85rem;">Xat</a>
                    </span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div style="margin-top:2rem; display:flex; gap:1rem;">
        <a th:href="@{/APRequest/add}" class="btn-card">+ Nova Sol·licitud</a>
        <a th:href="@{/dashboard/usuariOVI}" class="btn-card"
           style="background:#6b7280;">Tornar al Panel</a>
    </div>
</main>
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script>
    $(document).ready(function () {
        $('#tablaMylist').DataTable({
            language: {
                url: 'https://cdn.datatables.net/plug-ins/1.13.6/i18n/ca.json'
            },
            pageLength: 10,
            columnDefs: [{ orderable: false, targets: 4 }]
        });
    });
</script>
</body>
</html>
