<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>SgOVI - Editar Sol·licitud</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="form-page">
<nav>
    <span class="nav-brand">SgOVI - Administració</span>
    <div class="nav-right">
        <a th:href="@{/APRequest/list}" class="btn-logout">Tornar a la llista</a>
    </div>
</nav>
<main>
    <h1 class="page-title">Editar Sol·licitud</h1>
    <p class="page-subtitle">Modifica les dades de la sol·licitud.</p>

    <div class="form-card">
        <form th:action="@{/APRequest/updateAdmin}" th:object="${apRequest}" method="post">

            <input type="hidden" th:field="*{idSolicitud}"/>
            <input type="hidden" th:field="*{idUsuarioOvi}"/>

            <div class="form-group">
                <label>Usuari OVI</label>
                <div class="field-readonly" th:text="${apRequest.idUsuarioOvi}"></div>
            </div>

            <div class="form-group">
                <label for="estado">Estat</label>
                <select id="estado" th:field="*{estado}">
                    <option value="En revisión">En revisió</option>
                    <option value="Aprobada">Aprovada</option>
                    <option value="Rechazada">Rebutjada</option>
                </select>
            </div>

            <div class="form-group">
                <label for="tipoAsistencia">Tipus d'Assistència</label>
                <select id="tipoAsistencia" th:field="*{tipoAsistencia}">
                    <option value="PAP">PAP</option>
                    <option value="PATI">PATI</option>
                </select>
            </div>

            <div class="form-group">
                <label for="proximidad">Província</label>
                <select id="proximidad" th:field="*{proximidad}">
                    <option th:each="p : ${provincias}"
                            th:value="${p}" th:text="${p}"></option>
                </select>
            </div>

            <div class="form-group">
                <label for="preferencias">Preferències</label>
                <textarea id="preferencias" th:field="*{preferencias}" rows="4"></textarea>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">Actualitzar</button>
                <a th:href="@{/APRequest/list}" class="btn btn-outline" style="flex: 1; text-align: center;">Cancel·lar</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
