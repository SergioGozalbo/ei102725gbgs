<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>SgOVI - Detalls del Candidat</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="form-page">
<nav>
    <span class="nav-brand">SgOVI</span>
    <div class="nav-right">
        <a th:if="${teContracte}"
           th:href="@{/APRequest/mylist}" class="btn-logout">Tornar</a>
        <a th:unless="${teContracte}"
           th:href="@{/APRequest/candidatsEscollits/{id}(id=${idSolicitud})}"
           class="btn-logout">Tornar als candidats</a>
    </div>
</nav>
<main>
    <div class="page-actions">
        <div>
            <h1 class="page-title">Detalls del Candidat</h1>
            <p class="page-subtitle">Informació de l'assistent personal.</p>
        </div>
    </div>
    <div class="form-card" style="max-width:700px;">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:2rem;">
            <div>
                <h2 class="card-title"
                    style="margin-bottom:1rem; padding-bottom:0.5rem;
                           border-bottom:2px solid #e5e7eb;">
                    Dades personals
                </h2>
                <div class="field-group">
                    <span class="field-label">Nom</span>
                    <div class="field-readonly"
                         th:text="${assistent.nombre}"></div>
                </div>
                <div class="field-group">
                    <span class="field-label">Cognoms</span>
                    <div class="field-readonly"
                         th:text="${assistent.apellidos}"></div>
                </div>
                <div class="field-group">
                    <span class="field-label">Email</span>
                    <div class="field-readonly"
                         th:text="${assistent.email}"></div>
                </div>
                <div class="field-group">
                    <span class="field-label">Telèfon</span>
                    <div class="field-readonly"
                         th:text="${assistent.telefono}"></div>
                </div>
            </div>
            <div>
                <h2 class="card-title"
                    style="margin-bottom:1rem; padding-bottom:0.5rem;
                           border-bottom:2px solid #e5e7eb;">
                    Experiència i formació
                </h2>
                <div class="field-group">
                    <span class="field-label">Formació acadèmica</span>
                    <div class="field-readonly"
                         style="white-space:pre-wrap; min-height:60px;"
                         th:text="${assistent.formacionAcademica}"></div>
                </div>
                <div class="field-group">
                    <span class="field-label">Experiència professional</span>
                    <div class="field-readonly"
                         style="white-space:pre-wrap; min-height:60px;"
                         th:text="${assistent.experiencia}"></div>
                </div>
            </div>
        </div>
        <div class="table-actions" style="margin-top:1.5rem;">
            <a th:if="${teContracte}"
               th:href="@{/APRequest/mylist}"
               class="btn-back">Tornar a sol·licituds</a>
            <a th:unless="${teContracte}"
               th:href="@{/APRequest/candidatsEscollits/{id}(id=${idSolicitud})}"
               class="btn-back">Tornar als candidats</a>
        </div>
    </div>
</main>
</body>
</html>
