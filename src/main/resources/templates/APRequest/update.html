<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SgOVI - Actualitzar Sol·licitud</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<main>

<div class="card">
    <div class="header">
        <div class="logo">
            <span style="color: white; font-weight: bold; font-size: 1.5rem;">✎</span>
        </div>
        <h1>Actualitzar Sol·licitud</h1>
        <p class="subtitle">Modifica els detalls de la teua petició</p>
    </div>

    <form th:action="@{/APRequest/update}" th:object="${apRequest}" method="post">
        <input type="hidden" th:field="*{idSolicitud}"/>
        <input type="hidden" th:field="*{idUsuarioOvi}"/>
        <input type="hidden" th:field="*{estado}"/>

        <div class="form-group">
            <label for="tipoAsistencia" class="field-label">Tipus d'Assistència</label>
            <select id="tipoAsistencia"
                    th:field="*{tipoAsistencia}"
                    class="form-select">
                <option value="PAP">PAP (Personal)</option>
                <option value="PATI">PATI (Tècnica)</option>
            </select>
            <div class="error" th:if="${#fields.hasErrors('tipoAsistencia')}" th:errors="*{tipoAsistencia}"></div>
        </div>

        <div class="form-group">
            <label for="proximidad" class="field-label">Província</label>
            <select id="proximidad"
                    th:field="*{proximidad}"
                    class="form-select">
                <option th:each="prov : ${provincias}" th:value="${prov}" th:text="${prov}"></option>
            </select>
            <div class="error" th:if="${#fields.hasErrors('proximidad')}" th:errors="*{proximidad}"></div>
        </div>

        <div class="form-group">
            <label for="preferencias" class="field-label">Preferències</label>
            <textarea id="preferencias"
                      th:field="*{preferencias}"
                      rows="4"></textarea>
            <div class="error" th:if="${#fields.hasErrors('preferencias')}" th:errors="*{preferencias}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Guardar Canvis</button>
        <a th:href="@{/APRequest/mylist}" class="btn btn-outline">Tornar a la meua llista</a>
    </form>

</div>
</main>
</body>
</html>
