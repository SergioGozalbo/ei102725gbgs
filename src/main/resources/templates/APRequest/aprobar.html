<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalles de la Solicitud</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="card">
    <h1>Detalles de Solicitud #<span th:text="${solicitud.idSolicitud}"></span></h1>

    <div class="details-section">
        <p><strong>Usuario OVI:</strong> <span th:text="${solicitud.idUsuarioOvi}"></span></p>
        <p><strong>Tipo Asistencia:</strong> <span th:text="${solicitud.tipoAsistencia}"></span></p>
        <p><strong>Preferencias:</strong> <span th:text="${solicitud.preferencias}"></span></p>
        <p><strong>Proximidad:</strong> <span th:text="${solicitud.proximidad}"></span></p>
        <p><strong>Estado Actual:</strong> <span th:text="${solicitud.estado}"></span></p>
    </div>

    <div class="actions" style="margin-top: 20px; display: flex; gap: 10px;">
        <<form th:action="@{/APRequest/aprobar}" method="post">
        <input type="hidden" name="idSolicitud" th:value="${solicitud.idSolicitud}"/>

        <button type="submit" name="estado" value="Aprobada" class="btn btn-primary">
            Aprobar Solicitud
        </button>

        <button type="submit" name="estado" value="Rechazada" class="btn" style="background-color: #dc2626; color: white;">
            Rechazar Solicitud
        </button>
    </form>
    </div>

    <br>
    <a th:href="@{/APRequest/list}" class="footer-text">Volver a la lista</a>
</div>
</body>
</html>
