<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>SgOVI - Registre Usuari OVI</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"/>
</head>
<body class="bg-light">
<main class="container py-5">
  <div class="card shadow p-4 mx-auto" style="max-width: 560px;">
    <h1 class="h4 mb-4 text-center">Registre com a Usuari OVI</h1>

    <form th:action="@{/registro/usuariOVI}" th:object="${usuariOVI}" method="post">

      <div class="mb-3">
        <label for="nombre" class="form-label">Nom</label>
        <input id="nombre" type="text" class="form-control"
               th:field="*{nombre}" placeholder="El teu nom"/>
        <div th:if="${#fields.hasErrors('nombre')}"
             th:errors="*{nombre}" class="text-danger small mt-1"></div>
      </div>

      <div class="mb-3">
        <label for="apellidos" class="form-label">Cognoms</label>
        <input id="apellidos" type="text" class="form-control"
               th:field="*{apellidos}" placeholder="Els teus cognoms"/>
        <div th:if="${#fields.hasErrors('apellidos')}"
             th:errors="*{apellidos}" class="text-danger small mt-1"></div>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input id="email" type="email" class="form-control"
               th:field="*{email}" placeholder="correu@exemple.com"/>
        <div th:if="${#fields.hasErrors('email')}"
             th:errors="*{email}" class="text-danger small mt-1"></div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Contrasenya</label>
        <input id="password" type="password" class="form-control"
               th:field="*{password}" placeholder="••••••••"/>
        <div th:if="${#fields.hasErrors('password')}"
             th:errors="*{password}" class="text-danger small mt-1"></div>
      </div>

      <div class="mb-3">
        <label for="telefono" class="form-label">Telèfon</label>
        <input id="telefono" type="tel" class="form-control"
               th:field="*{telefono}" placeholder="6XXXXXXXX"/>
        <div th:if="${#fields.hasErrors('telefono')}"
             th:errors="*{telefono}" class="text-danger small mt-1"></div>
      </div>

      <div class="mb-3 form-check">
        <input id="consentimientoRgpd" type="checkbox" class="form-check-input"
               th:field="*{consentimientoRgpd}"/>
        <label for="consentimientoRgpd" class="form-check-label">
          Accepte el tractament de les meues dades personals (RGPD)
        </label>
        <div th:if="${#fields.hasErrors('consentimientoRgpd')}"
             th:errors="*{consentimientoRgpd}" class="text-danger small mt-1"></div>
      </div>

      <button type="submit" class="btn btn-primary w-100">Registrar-me</button>
    </form>

    <hr/>
    <p class="text-center small mb-0">
      Ja tens compte? <a th:href="@{/login}">Inicia sessió</a>
    </p>
  </div>
</main>
</body>
</html>
