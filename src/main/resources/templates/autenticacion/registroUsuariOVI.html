<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>SgOVI - Registro Usuario OVI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0f1f3d 0%, #1a56db 100%);
        padding: 2rem 0;
    }

    .card {
        background: #ffffff;
        border-radius: 20px;
        padding: 3rem 2.5rem;
        width: 100%;
        max-width: 480px;
        margin: 1.5rem;
        box-shadow: 0 25px 60px rgba(0,0,0,0.3);
    }

    .header {
        text-align: center;
        margin-bottom: 2rem;
    }

    .logo {
        width: 70px;
        height: 70px;
        background: #0f1f3d;
        border-radius: 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1.5rem;
        box-shadow: 0 8px 20px rgba(15,31,61,0.3);
    }

    h1 {
        font-size: 1.6rem;
        font-weight: 700;
        color: #0f1f3d;
        margin-bottom: 0.3rem;
        letter-spacing: -0.5px;
    }

    .subtitle {
        font-size: 0.85rem;
        color: #6b7280;
    }

    .form-group {
        margin-bottom: 1.2rem;
    }

    label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        color: #0f1f3d;
        margin-bottom: 0.4rem;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="tel"] {
        width: 100%;
        padding: 0.8rem 1rem;
        border: 2px solid #e5e7eb;
        border-radius: 10px;
        font-size: 0.95rem;
        font-family: 'Segoe UI', Arial, sans-serif;
        color: #0f1f3d;
        transition: border-color 0.2s;
        outline: none;
    }

    input:focus { border-color: #1a56db; }

    .checkbox-group {
        display: flex;
        align-items: flex-start;
        gap: 0.6rem;
        margin-bottom: 1.2rem;
    }

    .checkbox-group input[type="checkbox"] {
        width: 18px;
        height: 18px;
        margin-top: 2px;
        accent-color: #0f1f3d;
        flex-shrink: 0;
    }

    .checkbox-group label {
        font-size: 0.85rem;
        color: #6b7280;
        font-weight: 400;
        margin: 0;
    }

    .error {
        font-size: 0.78rem;
        color: #dc2626;
        margin-top: 0.3rem;
    }

    .btn-primary {
        display: block;
        width: 100%;
        padding: 0.9rem;
        background: #0f1f3d;
        color: #ffffff;
        border: none;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        margin-top: 0.5rem;
        transition: background 0.2s, transform 0.15s;
    }

    .btn-primary:hover {
        background: #1a56db;
        transform: translateY(-2px);
    }

    .divider {
        height: 1px;
        background: #e5e7eb;
        margin: 1.75rem 0 1.5rem;
    }

    .footer-text {
        font-size: 0.82rem;
        color: #6b7280;
        text-align: center;
    }

    .footer-text a {
        color: #1a56db;
        text-decoration: none;
        font-weight: 600;
    }

    .footer-text a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="logo" style="margin: 0 auto 1.5rem;">
      <svg width="34" height="34" viewBox="0 0 32 32" fill="none">
        <circle cx="12" cy="9" r="4" fill="white"/>
        <circle cx="22" cy="9" r="3" fill="white" opacity="0.5"/>
        <path d="M4 24c0-4.418 3.582-8 8-8s8 3.582 8 8" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M22 18c2.761 0 5 2.239 5 5" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
      </svg>
    </div>
    <h1>Registro Usuario OVI</h1>
    <p class="subtitle">Crea tu cuenta para acceder al sistema</p>
  </div>

  <form th:action="@{/registro/usuariOVI}" th:object="${usuariOVI}" method="post">
    <div class="form-group">
      <label for="nombre">Nombre</label>
      <input id="nombre" type="text" th:field="*{nombre}" placeholder="Tu nombre"/>
      <div th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="error"></div>
    </div>

    <div class="form-group">
      <label for="apellidos">Apellidos</label>
      <input id="apellidos" type="text" th:field="*{apellidos}" placeholder="Tus apellidos"/>
      <div th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}" class="error"></div>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" th:field="*{email}" placeholder="correo@ejemplo.com"/>
      <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error"></div>
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input id="password" type="password" th:field="*{password}" placeholder="••••••••"/>
      <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error"></div>
    </div>

    <div class="form-group">
      <label for="telefono">Teléfono</label>
      <input id="telefono" type="tel" th:field="*{telefono}" placeholder="6XXXXXXXX"/>
      <div th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}" class="error"></div>
    </div>

    <div class="checkbox-group">
      <input id="consentimientoRgpd" type="checkbox" th:field="*{consentimientoRgpd}"/>
      <label for="consentimientoRgpd">Acepto el tratamiento de mis datos personales (RGPD)</label>
    </div>
    <div th:if="${#fields.hasErrors('consentimientoRgpd')}" th:errors="*{consentimientoRgpd}" class="error"></div>

    <button type="submit" class="btn-primary">Registrarme</button>
  </form>

  <div class="divider"></div>

  <p class="footer-text">
    ¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a>
  </p>
</div>
</body>
</html>
