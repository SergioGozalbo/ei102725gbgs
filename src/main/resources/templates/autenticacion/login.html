<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>SgOVI - Iniciar sesión</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f1f3d 0%, #1a56db 100%);
        }

        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 420px;
            margin: 1.5rem;
            box-shadow: 0 25px 60px rgba(0,0,0,0.3);
        }

        .logo {
            width: 70px;
            height: 70px;
            background: #0f1f3d;
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            box-shadow: 0 8px 20px rgba(15,31,61,0.3);
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #0f1f3d;
            margin-bottom: 0.3rem;
            letter-spacing: -0.5px;
            text-align: center;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #6b7280;
            margin-bottom: 2rem;
            text-align: center;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #0f1f3d;
            margin-bottom: 0.4rem;
        }

        input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #0f1f3d;
            transition: border-color 0.2s;
            outline: none;
        }

        input:focus {
            border-color: #1a56db;
        }

        .error {
            font-size: 0.78rem;
            color: #dc2626;
            margin-top: 0.3rem;
        }

        .alert-error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            font-size: 0.85rem;
            margin-bottom: 1.2rem;
        }

        .btn-primary {
            display: block;
            width: 100%;
            padding: 0.9rem;
            background: #0f1f3d;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: background 0.2s, transform 0.15s;
        }

        .btn-primary:hover {
            background: #1a56db;
            transform: translateY(-2px);
        }

        .divider {
            height: 1px;
            background: #e5e7eb;
            margin: 1.75rem 0 1.5rem;
        }

        .footer-text {
            font-size: 0.82rem;
            color: #6b7280;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .footer-text a {
            color: #1a56db;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-text a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="card">
    <div class="header">
        <div class="logo" style="margin: 0 auto 1.5rem;">
            <svg width="34" height="34" viewBox="0 0 32 32" fill="none">
                <circle cx="12" cy="9" r="4" fill="white"/>
                <circle cx="22" cy="9" r="3" fill="white" opacity="0.5"/>
                <path d="M4 24c0-4.418 3.582-8 8-8s8 3.582 8 8" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M22 18c2.761 0 5 2.239 5 5" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
            </svg>
        </div>
        <h1>Iniciar sesión</h1>
        <p class="subtitle">Bienvenido de nuevo a SgOVI</p>
    </div>

    <div th:if="${error}" class="alert-error" th:text="${error}"></div>

    <form th:action="@{/login}" th:object="${usuariOVI}" method="post">
        <div class="form-group">
            <label for="email">Email</label>
            <input id="email" type="email" th:field="*{email}" placeholder="correo@ejemplo.com"/>
            <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error"></div>
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input id="password" type="password" th:field="*{password}" placeholder="••••••••"/>
            <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error"></div>
        </div>

        <button type="submit" class="btn-primary">Entrar</button>
    </form>

    <div class="divider"></div>

    <p class="footer-text">
        ¿Eres nuevo usuario OVI?
        <a th:href="@{/registro/usuariOVI}">Regístrate como Usuario OVI</a>
    </p>
    <p class="footer-text">
        ¿Quieres ser asistente personal?
        <a th:href="@{/registro/assistentPersonal}">Regístrate como Asistente</a>
    </p>
</div>
</body>
</html>
