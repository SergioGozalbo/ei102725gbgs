<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>SgOVI - Iniciar sesión</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="card">
    <div th:replace="~{fragments/notificacion :: notificacion}"></div>
    <div class="header">
        <div class="logo">
            <svg width="34" height="34" viewBox="0 0 32 32" fill="none">
                <circle cx="12" cy="9" r="4" fill="white"/>
                <circle cx="22" cy="9" r="3" fill="white" opacity="0.5"/>
                <path d="M4 24c0-4.418 3.582-8 8-8s8 3.582 8 8" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M22 18c2.761 0 5 2.239 5 5" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
            </svg>
        </div>
        <h1>Iniciar sesión</h1>
        <p class="subtitle">Bienvenido de nuevo a SgOVI</p>
    </div>

    <div th:if="${error}" class="alert-error" th:text="${error}"></div>

    <form th:action="@{/login}" th:object="${usuariOVI}" method="post">
        <div class="form-group">
            <label for="email">Email</label>
            <input id="email" type="email" th:field="*{email}" placeholder="correo@ejemplo.com"/>
            <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error"></div>
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input id="password" type="password" th:field="*{password}" placeholder="••••••••"/>
            <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error"></div>
        </div>

        <button type="submit" class="btn btn-primary">Entrar</button>
    </form>

    <div class="divider"></div>

    <p class="footer-text">
        ¿Eres nuevo usuario OVI?
        <a th:href="@{/registro/usuariOVI}">Regístrate como Usuario OVI</a>
    </p>
    <p class="footer-text">
        ¿Quieres ser asistente personal?
        <a th:href="@{/registro/assistentPersonal}">Regístrate como Asistente</a>
    </p>
</div>
</body>
</html>
