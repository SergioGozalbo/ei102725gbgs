<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>SgOVI - Registro</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f1f3d 0%, #1a56db 100%);
        }

        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 420px;
            margin: 1.5rem;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.3);
        }

        .logo {
            width: 70px;
            height: 70px;
            background: #0f1f3d;
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            box-shadow: 0 8px 20px rgba(15,31,61,0.3);
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #0f1f3d;
            margin-bottom: 0.3rem;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #6b7280;
            margin-bottom: 2.5rem;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 0.9rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            margin-bottom: 0.75rem;
            transition: background 0.2s, transform 0.15s;
        }

        .btn:hover { transform: translateY(-2px); }

        .btn-primary {
            background: #0f1f3d;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(15,31,61,0.35);
        }

        .btn-primary:hover {
            background: #1a56db;
            box-shadow: 0 8px 20px rgba(26,86,219,0.4);
        }

        .btn-outline {
            background: transparent;
            color: #0f1f3d;
            border: 2px solid #0f1f3d;
        }

        .btn-outline:hover {
            background: #0f1f3d;
            color: #ffffff;
        }

        .divider {
            height: 1px;
            background: #e5e7eb;
            margin: 1.75rem 0 1.5rem;
        }

        .footer-text {
            font-size: 0.82rem;
            color: #6b7280;
        }

        .footer-text a {
            color: #1a56db;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-text a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo" style="margin: 0 auto 1.5rem;">
        <svg width="34" height="34" viewBox="0 0 32 32" fill="none">
            <circle cx="12" cy="9" r="4" fill="white"/>
            <circle cx="22" cy="9" r="3" fill="white" opacity="0.5"/>
            <path d="M4 24c0-4.418 3.582-8 8-8s8 3.582 8 8" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M22 18c2.761 0 5 2.239 5 5" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
        </svg>
    </div>

    <h1>Crear cuenta</h1>
    <p class="subtitle">Elige el tipo de cuenta que quieres crear</p>

    <a th:href="@{/registro/usuariOVI}" class="btn btn-primary">Soy Usuario OVI</a>
    <a th:href="@{/registro/assistentPersonal}" class="btn btn-outline">Quiero ser Asistente Personal</a>

    <div class="divider"></div>

    <p class="footer-text">
        ¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a>
    </p>
</div>
</body>
</html>
