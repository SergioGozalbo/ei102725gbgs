<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>SgOVI - Xat</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <style>
        .chat-container {
            max-width: 700px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }
        .chat-messages {
            height: 400px;
            overflow-y: scroll;
            padding: 1rem;
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .message-bubble {
            max-width: 70%;
            padding: 0.6rem 1rem;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .message-mine {
            align-self: flex-end;
            background: #1a56db;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message-theirs {
            align-self: flex-start;
            background: #e5e7eb;
            color: #111827;
            border-bottom-left-radius: 4px;
        }
        .message-time {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-top: 0.2rem;
            display: block;
        }
        .chat-input-row {
            display: flex;
            gap: 0.5rem;
        }
        .chat-input-row input[type="text"] {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 24px;
            font-size: 0.95rem;
            outline: none;
        }
        .chat-input-row input[type="text"]:focus {
            border-color: #1a56db;
        }
        .chat-input-row button {
            padding: 0.75rem 1.5rem;
            background: #1a56db;
            color: white;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-weight: 600;
        }
        .chat-input-row button:hover {
            background: #1648c0;
        }
    </style>
</head>
<body class="dashboard">
<nav>
    <span class="nav-brand">SgOVI</span>
    <div class="nav-right">
        <a th:if="${remitenteType == 'OVI'}"
           th:href="@{/APRequest/candidatsEscollits/{id}(id=${idSolicitud})}"
           class="btn-logout">Tornar</a>
        <a th:if="${remitenteType == 'ASISTENT'}"
           th:href="@{/AssistentPersonal/requests}"
           class="btn-logout">Tornar</a>
    </div>
</nav>
<main>
    <h1 class="page-title">Xat</h1>
    <p class="page-subtitle"
       th:text="'Sol·licitud #' + ${idSolicitud}
                + ' · ' + ${solicitud.tipoAsistencia}
                + ' · ' + ${solicitud.proximidad}">
    </p>

    <div class="chat-container">
        <div class="chat-messages">
            <div th:if="${#lists.isEmpty(mensajes)}"
                 style="text-align:center; color:#9ca3af; margin:auto;">
                Encara no hi ha missatges. Comença la conversa!
            </div>
            <div th:each="m : ${mensajes}"
                 th:class="${m.remitenteId == miRemitenteId}
                            ? 'message-bubble message-mine'
                            : 'message-bubble message-theirs'">
                <span th:text="${m.contenido}"></span>
                <span class="message-time"
                      th:text="${#temporals.format(m.fechaEnvio,
                                 'dd/MM/yyyy HH:mm')}"></span>
            </div>
        </div>

        <form th:action="@{/chat/{id}/send(id=${idSolicitud})}"
              method="post" class="chat-input-row">
            <input type="hidden" name="idAsistente"
                   th:value="${idAsistente}"/>
            <input type="text" name="contenido"
                   placeholder="Escriu un missatge..."
                   autocomplete="off"/>
            <button type="submit">Enviar</button>
        </form>
    </div>
</main>
</body>
</html>
