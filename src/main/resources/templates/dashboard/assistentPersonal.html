<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>SgOVI - Assistent Personal</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">SgOVI - Assistent Personal</span>
        <div class="ms-auto">
            <span class="text-light me-3 small"
                  th:text="'Benvingut, ' + ${assistent.nombre}"></span>
            <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">Tancar sessió</a>
        </div>
    </div>
</nav>

<main class="container py-5">
    <h2 class="mb-4">El meu espai</h2>

    <div class="row g-4">
        <div class="col-md-6">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">El meu perfil</h5>
                    <p class="card-text text-muted">Consulta i modifica les teues dades.</p>
                    <a th:href="@{/AssistentPersonal/profile}"
                       class="btn btn-primary">Veure perfil</a>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Sol·licituds rebudes</h5>
                    <p class="card-text text-muted">Consulta les sol·licituds d'assistència.</p>
                    <a th:href="@{/ApRequest/list}" class="btn btn-primary">Veure sol·licituds</a>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
