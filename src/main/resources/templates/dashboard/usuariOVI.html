<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>SgOVI - Usuario OVI</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="dashboard">
<nav>
    <span class="nav-brand">SgOVI</span>
    <div class="nav-right">
        <span class="nav-user" th:text="'Bienvenido, ' + ${usuari.nombre}">Bienvenido</span>
        <a th:href="@{/logout}" class="btn-logout">Cerrar sesión</a>
    </div>
</nav>

<main>
    <h1 class="page-title">Mi espacio</h1>
    <p class="page-subtitle">Gestiona tu perfil y consulta el estado de tus solicitudes.</p>

    <div class="cards-grid">
        <div class="dashboard-card">
            <div class="card-icon" aria-hidden="true">👤</div>
            <h2 class="card-title">Mi perfil</h2>
            <p class="card-desc">Consulta y modifica tus datos personales.</p>
            <a th:href="@{/UsuariOVI/update/{id}(id=${usuari.idUsuario})}" class="btn-card">Ver perfil</a>
        </div>
        <div class="dashboard-card">
            <div class="card-icon" aria-hidden="true">📋</div>
            <h2 class="card-title">Mis solicitudes</h2>
            <p class="card-desc">Consulta el estado de tus solicitudes de asistencia.</p>
            <a th:href="@{/APRequest/mylist}" class="btn-card">Ver solicitudes</a>
        </div>
    </div>
</main>
</body>
</html>
