<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>SgOVI - Panel Admin</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"/>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">SgOVI - Administració</span>
        <div class="ms-auto">
            <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">Tancar sessió</a>
        </div>
    </div>
</nav>

<main class="container py-5">
    <h2 class="mb-4">Panel d'administració</h2>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Usuaris OVI</h5>
                    <p class="card-text text-muted">Gestiona els usuaris registrats a l'OVI.</p>
                    <a th:href="@{/usuariOVI/list}" class="btn btn-primary">Veure llista</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Assistents Personals</h5>
                    <p class="card-text text-muted">Gestiona els assistents i les seues sol·licituds.</p>
                    <a th:href="@{/assistentPersonal/list}" class="btn btn-primary">Veure llista</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Sol·licituds AP</h5>
                    <p class="card-text text-muted">Revisa i gestiona les sol·licituds d'assistència.</p>
                    <a th:href="@{/APRequest/list}" class="btn btn-primary">Veure llista</a>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
